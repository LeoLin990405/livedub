<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>livedub 实时同传</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #101219;
        --card: #191c26;
        --card-2: #202433;
        --line: #2b3042;
        --text: #eef0f7;
        --muted: #9aa0b4;
        --accent: #4a67ec;
        --accent-2: #6b86ff;
        --ok: #3ddc84;
        --warn: #f5b93f;
        --err: #ff5c6c;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        width: 348px;
        padding: 14px;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        font-size: 13px;
      }
      header { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
      .brand { display: flex; gap: 9px; align-items: center; }
      .logo {
        width: 30px; height: 30px; border-radius: 9px; flex: none;
        display: grid; place-items: center; font-size: 15px; font-weight: 700;
        background: linear-gradient(135deg, #4a67ec, #9b6bff); color: #fff;
      }
      h1 { margin: 0; font-size: 14px; font-weight: 700; letter-spacing: 0.2px; }
      .sub { margin: 2px 0 0; color: var(--muted); font-size: 11px; }
      .status {
        display: inline-flex; align-items: center; gap: 6px; flex: none;
        padding: 5px 9px; border-radius: 999px; background: var(--card);
        border: 1px solid var(--line); color: var(--muted); font-size: 11px; white-space: nowrap;
      }
      .dot { width: 7px; height: 7px; border-radius: 50%; background: #7c8196; flex: none; }
      .status[data-tone="live"] .dot { background: var(--ok); box-shadow: 0 0 6px var(--ok); }
      .status[data-tone="busy"] .dot { background: var(--warn); }
      .status[data-tone="translate"] .dot { background: #5aa9ff; }
      .status[data-tone="speak"] .dot { background: #b48cff; }
      .status[data-tone="error"] .dot { background: var(--err); }
      .card {
        background: var(--card); border: 1px solid var(--line); border-radius: 12px;
        padding: 10px 11px; margin-bottom: 10px;
      }
      .field { display: flex; flex-direction: column; gap: 5px; }
      .field > span { color: var(--muted); font-size: 11px; }
      input[type="text"], select {
        width: 100%; padding: 8px 9px; border-radius: 8px; font-size: 12px;
        background: var(--card-2); border: 1px solid var(--line); color: var(--text);
        outline: none; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      input[type="text"]:focus, select:focus { border-color: var(--accent-2); }
      select { font-family: inherit; font-size: 12.5px; }
      .actions { display: flex; gap: 6px; margin-top: 9px; flex-wrap: wrap; }
      button {
        border: none; border-radius: 9px; padding: 8px 10px; font-size: 12px; cursor: pointer;
        font-family: inherit; transition: background 0.15s ease, opacity 0.15s ease;
      }
      button:disabled { opacity: 0.55; cursor: default; }
      .ghost { background: var(--card-2); border: 1px solid var(--line); color: var(--text); flex: 1; min-width: 86px; }
      .ghost:hover:not(:disabled) { background: #262b3c; }
      .primary {
        width: 100%; padding: 11px; margin-bottom: 10px; font-size: 13px; font-weight: 700;
        background: var(--accent); color: #fff;
      }
      .primary:hover:not(:disabled) { background: #5570f0; }
      .primary[data-mode="stop"] { background: #b8434f; }
      .primary[data-mode="stop"]:hover:not(:disabled) { background: #c94d5a; }
      .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 10px; }
      .metric {
        background: var(--card); border: 1px solid var(--line); border-radius: 10px;
        padding: 7px 8px; display: flex; flex-direction: column; gap: 3px; min-width: 0;
      }
      .metric span { color: var(--muted); font-size: 10px; white-space: nowrap; }
      .metric b { font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; }
      .kv { display: flex; gap: 8px; padding: 3px 0; font-size: 12px; line-height: 1.45; }
      .kv span { color: var(--muted); flex: none; width: 34px; }
      .kv b { font-weight: 500; word-break: break-all; color: #d7dbe8; }
      .hint { margin: 6px 0 0; color: var(--muted); font-size: 10.5px; line-height: 1.5; }
      .footer { margin-top: 4px; }
      .error {
        margin-bottom: 10px; padding: 8px 10px; border-radius: 9px; font-size: 11.5px; line-height: 1.5;
        background: rgba(255, 92, 108, 0.14); border: 1px solid rgba(255, 92, 108, 0.42); color: #ffd3d7;
      }
      .error[data-kind="info"] { background: rgba(90, 169, 255, 0.13); border-color: rgba(90, 169, 255, 0.4); color: #cfe4ff; }
      .error[hidden] { display: none; }
      .health {
        display: flex; align-items: center; gap: 6px; margin-top: 8px;
        font-size: 11px; color: var(--muted);
      }
      .health .dot { width: 7px; height: 7px; }
      .health[data-state="online"] { color: #9fe9bd; }
      .health[data-state="online"] .dot { background: var(--ok); box-shadow: 0 0 6px var(--ok); }
      .health[data-state="offline"] { color: #ffb3ba; }
      .health[data-state="offline"] .dot { background: var(--err); }
      .health[data-state="checking"] .dot { background: var(--warn); }
      .health-detail { margin-top: 4px; color: var(--muted); font-size: 10.5px; line-height: 1.55; word-break: break-all; }
      .health-detail[hidden] { display: none; }
      .guidance {
        margin-bottom: 10px; padding: 10px 11px; border-radius: 11px;
        background: rgba(90, 169, 255, 0.12); border: 1px solid rgba(90, 169, 255, 0.34);
        font-size: 11.5px; line-height: 1.55; color: #d6e6ff;
      }
      .guidance[hidden] { display: none; }
      .guidance-title { font-weight: 700; margin-bottom: 4px; }
      .guidance-body { white-space: pre-line; color: #b9cbe4; }
      .guidance-actions { display: flex; gap: 6px; margin-top: 8px; }
      .guidance-actions button { flex: 1; font-size: 11.5px; padding: 6px 8px; }
      .inline { display: flex; align-items: center; gap: 5px; color: var(--muted); font-size: 11.5px; flex: 1; }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">
        <div class="logo">字</div>
        <div>
          <h1>livedub 实时同传</h1>
          <p class="sub">本地引擎 · 双语字幕 · 中文配音</p>
        </div>
      </div>
      <div class="status" id="status" data-tone="idle"><span class="dot"></span><span id="status-text">未连接</span></div>
    </header>

    <div id="error" class="error" hidden></div>

    <section class="card">
      <label class="field">
        <span>本地引擎地址（WebSocket）</span>
        <input id="engine-url" type="text" spellcheck="false" autocomplete="off" placeholder="ws://127.0.0.1:8787/ws" />
      </label>
      <div class="actions">
        <button id="save-url" class="ghost" type="button">保存地址</button>
        <button id="probe-engine" class="ghost" type="button">检测引擎</button>
        <button id="open-studio" class="ghost" type="button">打开工作台</button>
      </div>
      <div class="health" id="health" data-state="unknown">
        <span class="dot"></span><span id="health-text">引擎未检测</span>
      </div>
      <div class="health-detail" id="health-detail" hidden></div>
      <p class="hint" id="url-hint">默认 ws://127.0.0.1:8787/ws；启动引擎：cd livedub &amp;&amp; npm start</p>
    </section>

    <div id="guidance" class="guidance" hidden>
      <div class="guidance-title" id="guidance-title"></div>
      <div class="guidance-body" id="guidance-body"></div>
      <div class="guidance-actions">
        <button id="retry-engine" class="ghost" type="button">重试连接</button>
        <button id="probe-again" class="ghost" type="button">重新检测</button>
      </div>
    </div>

    <button id="toggle" class="primary" type="button" data-mode="start">开始同传</button>

    <section class="grid">
      <div class="metric"><span>ASR</span><b id="lat-asr">—</b></div>
      <div class="metric"><span>翻译</span><b id="lat-mt">—</b></div>
      <div class="metric"><span>配音</span><b id="lat-tts">—</b></div>
      <div class="metric"><span>端到端</span><b id="lat-e2e">—</b></div>
    </section>

    <section class="card">
      <div class="kv"><span>引擎</span><b id="providers">—</b></div>
      <div class="kv"><span>音色</span><b id="voice-detail">—</b></div>
      <div class="kv"><span>语言</span><b id="languages">—</b></div>
    </section>

    <section class="card">
      <label class="field">
        <span>音色模式</span>
        <select id="voice-mode">
          <option value="clone-first">克隆优先（不可用时自动降级）</option>
          <option value="preset">固定预设音色</option>
        </select>
      </label>
      <div class="actions">
        <button id="show-overlay" class="ghost" type="button">显示字幕浮层</button>
        <button id="export-srt" class="ghost" type="button">导出本次 SRT</button>
      </div>
      <p class="hint" id="caption-count">本次会话字幕 0 条</p>
    </section>

    <section class="card" id="notes-card">
      <div class="kv"><span>笔记</span><b id="note-stats">今日 0 条 · 待同步 0</b></div>
      <div class="kv"><span>画面</span><b id="vision-health">—</b></div>
      <div class="actions">
        <button id="capture-note" class="ghost" type="button">记当前句</button>
        <button id="open-notebook" class="ghost" type="button">打开笔记本</button>
      </div>
      <div class="actions">
        <button id="export-notes" class="ghost" type="button">导出 Markdown</button>
        <label class="inline"><input type="checkbox" id="note-screenshot" /> 附页面截图</label>
      </div>
      <div class="actions">
        <label class="inline"><input type="checkbox" id="vision-ocr" /> 识别画面文字（OCR，快）</label>
        <label class="inline"><input type="checkbox" id="vision-caption" /> 画面理解（VLM，慢）</label>
      </div>
      <p class="hint" id="note-hint">快捷键 Alt+Shift+N 记笔记 · Alt+Shift+L 开始/停止。截图与笔记只存本机 data/notes/。</p>
    </section>

    <p class="hint footer">
      抓音必须在用户手势内触发（点击上面的按钮）。若提示需要手势，请用快捷键 Alt+Shift+L 或重新打开本弹窗。
    </p>

    <script type="module" src="popup.js"></script>
  </body>
</html>
