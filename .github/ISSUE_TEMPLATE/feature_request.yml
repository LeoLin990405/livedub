name: Feature request
description: 提出新功能 / 改进建议
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        欢迎提想法！请说明使用场景，而不是只给方案。该项目坚持「本地优先 + 零运行时依赖」。
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 你希望解决什么问题？在看什么类型的视频/课程？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 可以描述接口/交互/配置形态，不必是最终方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: 涉及模块
      multiple: true
      options:
        - ASR / VAD
        - 翻译 / 字幕
        - TTS / 音色克隆
        - Chrome 扩展
        - 本地工作台
        - 学习笔记 / 导出
        - 服务端 / 协议
        - 文档 / 开发体验
    validations:
      required: true
